services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/app.db
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ARK_API_KEY: ${ARK_API_KEY}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-2-0-mini-260428}
      AI_PROXY_TOKEN: ${AI_PROXY_TOKEN}
    volumes:
      - ./data:/data
    ports:
      - "0.0.0.0:18081:8080"
